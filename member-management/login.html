<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>ログイン画面</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="login">
    <h1>ログイン</h1>
    <form action="#" method="get">
      <label for="id">ID</label>
      <input type="text" id="id" name="id" placeholder="IDを入力してください" required />

      <label for="password">PASS</label>
      <input type="password" id="password" name="password" placeholder="パスワードを入力してください" required />

      <button type="submit">ログイン</button>

    </form>

    <nav>
      <a href="register.html">会員登録</a>
      <a href="members.html">会員一覧</a>
    </nav>
  </main>
</body>

</html>
